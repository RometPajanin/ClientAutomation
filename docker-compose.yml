services:
  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: client_automation
      POSTGRES_PASSWORD: client_automation
      POSTGRES_DB: client_automation

    ports:
      # Bind only to this computer; PostgreSQL is not exposed to the local network.
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U client_automation -d client_automation"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
